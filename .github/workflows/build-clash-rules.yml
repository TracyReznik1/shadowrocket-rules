name: Build Clash Rules

on:
  workflow_dispatch:

  schedule:
    # UTC 01:00，相当于北京时间每天 09:00
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: build-clash-rules
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Convert Shadowrocket rules
        run: python tools/convert_shadowrocket_to_clash.py

      - name: Commit generated rules
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clash

          if git diff --cached --quiet; then
            echo "No rule changes."
            exit 0
          fi

          git commit -m "chore: update Clash rule providers"
          git push
